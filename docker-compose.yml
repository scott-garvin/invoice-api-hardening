services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invoices
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5450:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  after:
    build: ./after
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@db:5432/invoices
      DATABASE_URL: postgres://app_user:app_pw@db:5432/invoices
      JWT_SECRET: demo-secret-change-me
      PORT: "3000"
    command: sh -c "npm run migrate && npm run seed && npm start"
    ports:
      - "127.0.0.1:3010:3000"

  before:
    build: ./before
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/mvp
      PORT: "3001"
    command: sh -c "npm run migrate && npm run seed && npm start"
    ports:
      - "127.0.0.1:3011:3001"
